title: Kerry Ann Burke
description: Screenwriting, fiction and comedy
url: "https://kerryboyko.github.io"
baseurl: "/screenwriting"
markdown: kramdown
collections:
  projects:
    output: true
    permalink: /projects/:name/
  ideas:
    output: true
    permalink: /ideas/:name/
  essays:
    output: true
    permalink: /essays/:name/
  viewing:
    output: true
    permalink: /viewing/:name/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: ideas
    values:
      layout: idea
  - scope:
      path: ""
      type: essays
    values:
      layout: essay
  - scope:
      path: ""
      type: viewing
    values:
      layout: required_movie
exclude:
  - README.md
